[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-checks"
version = "0.1.0"
description = "Exact structured assumption and counterexample checks for small weighted graphs"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
atlas-checks = "atlas_checks.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_checks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
