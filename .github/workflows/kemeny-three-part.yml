name: Check Kemeny network-design proofs
on: [push, pull_request]
permissions:
  contents: read
jobs:
  exact-polynomial:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.8.19'
          python-version: '3.12.11'
      - name: Reconstruct the frozen polynomial exactly
        run: >-
          uv run --project experiments/kemeny-three-part-proof --frozen python
          experiments/kemeny-three-part-proof/run_logged.py
          --attempt-id ci-polynomial --timeout-seconds 60
          --log-dir work/kemeny-three-part-ci/logs -- python
          experiments/kemeny-three-part-proof/verify_coefficient_certificate.py
          --certificate experiments/kemeny-three-part-proof/coefficient-certificate.json
          --output work/kemeny-three-part-ci/certificate-check.json
      - name: Retain exact result and raw command outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kemeny-three-part-polynomial
          path: work/kemeny-three-part-ci/
          retention-days: 30
          if-no-files-found: warn
      - name: Check arbitrary part counts
        run: >-
          uv run --project experiments/kemeny-multipartite-proof --frozen python
          experiments/kemeny-three-part-proof/run_logged.py
          --attempt-id multipartite --timeout-seconds 60
          --log-dir work/kemeny-network-ci/logs -- python
          experiments/kemeny-multipartite-proof/verify_certificate.py
          --certificate experiments/kemeny-multipartite-proof/certificate.json
          --output work/kemeny-network-ci/multipartite.json
      - name: Check strict part-size ranking
        run: >-
          uv run --project experiments/kemeny-multipartite-proof --frozen python
          experiments/kemeny-three-part-proof/run_logged.py
          --attempt-id ranking --timeout-seconds 60
          --log-dir work/kemeny-network-ci/logs -- python
          experiments/kemeny-multipartite-proof/verify_ranking.py
          --output work/kemeny-network-ci/ranking.json
      - name: Retain network-design proof results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kemeny-network-design
          path: work/kemeny-network-ci/
          retention-days: 30
          if-no-files-found: warn
      - name: Check the specified hub-link deletion
        run: >-
          uv run --project experiments/kemeny-one-deletion-proof --frozen python
          experiments/kemeny-three-part-proof/run_logged.py
          --attempt-id hub-deletion --timeout-seconds 90
          --log-dir work/kemeny-failure-ci/logs -- python
          experiments/kemeny-one-deletion-proof/verify_certificate.py
          --certificate experiments/kemeny-one-deletion-proof/symbolic.json
          --output work/kemeny-failure-ci/hub-deletion.json
      - name: Check every original-edge deletion
        run: >-
          uv run --project experiments/kemeny-one-deletion-proof --frozen python
          experiments/kemeny-three-part-proof/run_logged.py
          --attempt-id all-deletions --timeout-seconds 90
          --log-dir work/kemeny-failure-ci/logs -- python
          experiments/kemeny-one-deletion-proof/verify_all_deletions.py
          --certificates experiments/kemeny-one-deletion-proof/all-deletions
          --output work/kemeny-failure-ci/all-deletions.json
      - name: Check optimal hub-link repair
        run: >-
          uv run --project experiments/kemeny-one-deletion-proof --frozen python
          experiments/kemeny-three-part-proof/run_logged.py
          --attempt-id optimal-repair --timeout-seconds 90
          --log-dir work/kemeny-failure-ci/logs -- python
          experiments/kemeny-one-deletion-proof/verify_optimal_repair.py
          --certificate experiments/kemeny-one-deletion-proof/optimal-repair.json
          --output work/kemeny-failure-ci/optimal-repair.json
      - name: Check the optimum when restoration is forbidden
        run: >-
          uv run --project experiments/kemeny-one-deletion-proof --frozen python
          experiments/kemeny-three-part-proof/run_logged.py
          --attempt-id alternative-repair --timeout-seconds 90
          --log-dir work/kemeny-failure-ci/logs -- python
          experiments/kemeny-one-deletion-proof/verify_alternative_repair.py
          --certificate experiments/kemeny-one-deletion-proof/alternative-repair.json
          --prior-certificate experiments/kemeny-one-deletion-proof/optimal-repair.json
          --output work/kemeny-failure-ci/alternative-repair.json
      - name: Check fixed-uniform optimal insertion and no-op comparison
        run: >-
          uv run --project experiments/kemeny-one-deletion-proof --frozen python
          experiments/kemeny-three-part-proof/run_logged.py
          --attempt-id uniform-repair --timeout-seconds 90
          --log-dir work/kemeny-failure-ci/logs -- python
          experiments/kemeny-one-deletion-proof/verify_uniform_repair.py
          --ranking-certificate experiments/kemeny-one-deletion-proof/uniform-ranking.json
          --noop-certificate experiments/kemeny-one-deletion-proof/uniform-noop.json
          --output work/kemeny-failure-ci/uniform-repair.json
      - name: Check weighted repair and strength premises
        run: >-
          uv run --project experiments/kemeny-one-deletion-proof --frozen python
          experiments/kemeny-three-part-proof/run_logged.py
          --attempt-id weighted-repair --timeout-seconds 90
          --log-dir work/kemeny-failure-ci/logs -- python
          experiments/kemeny-one-deletion-proof/verify_weighted_repair.py
          --weighted-certificate experiments/kemeny-one-deletion-proof/uniform-weighted.json
          --noop-certificate experiments/kemeny-one-deletion-proof/uniform-noop.json
          --output work/kemeny-failure-ci/weighted-repair.json
      - name: Retain single-failure proof results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kemeny-single-failure
          path: work/kemeny-failure-ci/
          retention-days: 30
          if-no-files-found: warn
      - name: Check the complete common-strength workload envelope
        run: >-
          uv run --project experiments/kemeny-workload-proof --frozen python
          experiments/kemeny-three-part-proof/run_logged.py
          --attempt-id workload-envelope --timeout-seconds 60
          --log-dir work/kemeny-workload-ci/logs -- uv run
          --project experiments/kemeny-workload-proof --frozen python
          experiments/kemeny-workload-proof/verify_workload_envelope.py
          --output work/kemeny-workload-ci/envelope.json
      - name: Check the full one-old-link perturbation intervals
        run: >-
          uv run --project experiments/kemeny-workload-proof --frozen python
          experiments/kemeny-three-part-proof/run_logged.py
          --attempt-id workload-continuous --timeout-seconds 60
          --log-dir work/kemeny-workload-ci/logs -- uv run
          --project experiments/kemeny-workload-proof --frozen python
          experiments/kemeny-workload-proof/verify_continuous_perturbation.py
          --output work/kemeny-workload-ci/continuous.json
      - name: Retain workload and robustness proofs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kemeny-workload-robustness
          path: work/kemeny-workload-ci/
          retention-days: 30
          if-no-files-found: warn
      - name: Check unit versus no action and exact strength rescue
        run: >-
          uv run --project experiments/kemeny-workload-proof --frozen python
          experiments/kemeny-three-part-proof/run_logged.py
          --attempt-id action-choice --timeout-seconds 60
          --log-dir work/kemeny-action-ci/logs -- uv run
          --project experiments/kemeny-workload-proof --frozen python
          experiments/kemeny-workload-proof/verify_action_choice.py
          --output work/kemeny-action-ci/check.json
      - name: Retain action-choice proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kemeny-workload-action-choice
          path: work/kemeny-action-ci/
          retention-days: 30
          if-no-files-found: warn
      - name: Check the complete deterministic unit-repair minimax rule
        run: >-
          uv run --project experiments/kemeny-workload-proof --frozen python
          experiments/kemeny-three-part-proof/run_logged.py
          --attempt-id unit-minimax --timeout-seconds 60
          --log-dir work/kemeny-minimax-ci/logs -- uv run
          --project experiments/kemeny-workload-proof --frozen python
          experiments/kemeny-workload-proof/verify_unit_minimax.py
          --output work/kemeny-minimax-ci/check.json
      - name: Retain deterministic unit-repair minimax proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kemeny-unit-minimax
          path: work/kemeny-minimax-ci/
          retention-days: 30
          if-no-files-found: warn
      - name: Check graph-general conductance minimax and exact solver
        run: >-
          uv run --project experiments/kemeny-workload-proof --frozen python
          experiments/kemeny-three-part-proof/run_logged.py
          --attempt-id strength-minimax --timeout-seconds 90
          --log-dir work/kemeny-strength-minimax-ci/logs -- uv run
          --project experiments/kemeny-workload-proof --frozen python
          experiments/kemeny-workload-proof/verify_strength_minimax.py
          --output work/kemeny-strength-minimax-ci/check.json
      - name: Retain conductance minimax proof and solver checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kemeny-strength-minimax
          path: work/kemeny-strength-minimax-ci/
          retention-days: 30
          if-no-files-found: warn
