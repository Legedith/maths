name: Check external concept connections
on: [push, pull_request]
permissions:
  contents: read
jobs:
  connections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.8.19'
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: uv run --frozen python scripts/import_relations.py --relations-csv data/mathgloss/relations/source/graph_edges.csv --catalog-csv data/mathgloss/source/database.csv --probe-inputs evidence/external-connections/sources/probe/frozen-inputs.json --probe-response evidence/external-connections/sources/probe/wikidata-response.json --probe-command-log evidence/external-connections/sources/probe/command-log.json --semantics-response evidence/external-connections/sources/semantics/wikidata-semantics-response.json --output-dir work/relation-ci
      - run: node scripts/check-external-relations.ts --reproduced-dir work/relation-ci
