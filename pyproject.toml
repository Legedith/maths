[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-engine"
version = "0.1.0"
description = "Exact graph invariants for the Laplacian bridge atlas"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

